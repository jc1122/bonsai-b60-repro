name: Reproduction checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate measured results and benchmark failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Allocation guard without GPU
        run: python3 scripts/guard_test.py
      - name: Pinned source and CPU state red-green regression
        run: python3 scripts/check_state.py --jobs 2
